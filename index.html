<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión Académica — Iniciar Sesión</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="page-login">

    <div class="login-bg">
        <div class="login-bg-shape login-bg-shape--1"></div>
        <div class="login-bg-shape login-bg-shape--2"></div>
    </div>

    <div class="login-wrapper">

        <!-- Marca institucional -->
        <div class="login-brand">
            <div class="login-logo">
                <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect width="48" height="48" rx="14" fill="#2563eb"/>
                    <path d="M24 10L38 17.5V26C38 33.18 31.84 39.9 24 42C16.16 39.9 10 33.18 10 26V17.5L24 10Z" fill="white" fill-opacity="0.15"/>
                    <path d="M24 13L36 19.8V26C36 32.38 30.6 38.42 24 40.2C17.4 38.42 12 32.38 12 26V19.8L24 13Z" stroke="white" stroke-width="1.5" fill="none"/>
                    <path d="M18 24H30M24 18V30" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                </svg>
            </div>
            <h1 class="login-brand-title">Sistema de Gestión Académica</h1>
            <p class="login-brand-sub">Plataforma Institucional de Administración</p>
        </div>

        <!-- Tarjeta de acceso -->
        <div class="login-card">
            <div class="login-card-header">
                <h2 class="login-card-title">Iniciar Sesión</h2>
                <p class="login-card-desc">Ingrese sus credenciales para acceder al sistema</p>
            </div>

            <form id="loginForm" autocomplete="off" novalidate>

                <div class="field-group">
                    <label class="field-label" for="username">Usuario</label>
                    <div class="field-input-wrap">
                        <span class="field-prefix-icon">
                            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 9a3 3 0 100-6 3 3 0 000 6zm-7 9a7 7 0 1114 0H3z" clip-rule="evenodd"/></svg>
                        </span>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            class="field-input"
                            placeholder="Ingrese su usuario"
                            autocomplete="off"
                            spellcheck="false"
                        >
                    </div>
                </div>

                <div class="field-group">
                    <label class="field-label" for="password">Contraseña</label>
                    <div class="field-input-wrap">
                        <span class="field-prefix-icon">
                            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5 9V7a5 5 0 0110 0v2a2 2 0 012 2v5a2 2 0 01-2 2H5a2 2 0 01-2-2v-5a2 2 0 012-2zm8-2v2H7V7a3 3 0 016 0z" clip-rule="evenodd"/></svg>
                        </span>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            class="field-input"
                            placeholder="Ingrese su contraseña"
                            autocomplete="off"
                        >
                    </div>
                </div>

                <!-- Error visible para Selenium assertText -->
                <div id="loginError" class="alert alert-error" role="alert" aria-live="polite"></div>

                <button type="submit" id="btnLogin" class="btn btn-primary btn-block">
                    <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 102 0V4a1 1 0 00-1-1zm10.293 9.293a1 1 0 001.414 1.414l3-3a1 1 0 000-1.414l-3-3a1 1 0 10-1.414 1.414L14.586 9H7a1 1 0 100 2h7.586l-1.293 1.293z" clip-rule="evenodd"/></svg>
                    Ingresar al Sistema
                </button>

            </form>

            <!-- Credenciales de prueba visibles -->
            <div class="login-test-creds">
                <div class="test-creds-label">
                    <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"/></svg>
                    Credenciales de prueba
                </div>
                <div class="test-creds-row">
                    <span class="test-creds-item">
                        <strong>Usuario:</strong>
                        <code>admin</code>
                    </span>
                    <span class="test-creds-sep">|</span>
                    <span class="test-creds-item">
                        <strong>Contraseña:</strong>
                        <code>12345</code>
                    </span>
                </div>
            </div>
        </div>

        <!-- Pie de página -->
        <footer class="login-footer">
            <p>Sistema de Gestión Académica &copy; 2025</p>
            <p class="login-footer-author">Elaborado por: <strong>Yeison Fabian Martinez Teatino</strong></p>
        </footer>

    </div>

    <script src="auth.js"></script>
</body>
</html>
